syntax = "proto3";

package target;

option go_package = "mbg/api/proto";

// TargetService adalah layanan yang harus diimplementasikan oleh setiap Worker/Target
// agar Message Broker bisa mengirimkan pesan secara proaktif (Push).
service TargetService {
  rpc Deliver(DeliveryRequest) returns (DeliveryResponse);
}

message DeliveryRequest {
  string id = 1;
  string payload = 2;
  int64 origin_timestamp = 3;
  string headers = 4;
}

message DeliveryResponse {
  string id = 1;
  string status = 2;
  int64 processed_at = 3;
  string message = 4;
}
